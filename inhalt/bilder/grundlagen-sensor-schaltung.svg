<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif" font-size="15">
  <title>Sensoren am Motorsteuergerät A1: dreipoliger Drucksensor B1 (5 V, Signal, Masse) und NTC-Temperaturfühler B2 mit Pull-up-Widerstand R1, Messpunkte A bis E</title>
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>

  <!-- Steuergerät A1 -->
  <rect x="360" y="20" width="265" height="420" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="440" y="430" fill="#1a1a1a">A1 Motorsteuergerät</text>

  <!-- Sensor B1 (3-polig) -->
  <rect x="40" y="40" width="110" height="160" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <rect x="62" y="100" width="34" height="40" fill="#ffffff"/>
    <line x1="56" y1="148" x2="102" y2="92"/>
  </g>
  <path d="M102 92 L92 96 L98 102 Z" fill="#1a1a1a"/>
  <g fill="#1a1a1a">
    <text x="70" y="118" text-anchor="middle">p</text>
    <text x="48" y="62">B1</text>
    <text x="40" y="222">Drucksensor</text>
    <text x="140" y="75" text-anchor="end">1</text>
    <text x="140" y="125" text-anchor="end">2</text>
    <text x="140" y="175" text-anchor="end">3</text>
  </g>

  <!-- Leitungen B1 → A1 -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="150" y1="70" x2="360" y2="70"/>
    <line x1="150" y1="120" x2="360" y2="120"/>
    <line x1="150" y1="170" x2="360" y2="170"/>
  </g>

  <!-- Sensor B2 (NTC) -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="110" y1="270" x2="360" y2="270"/>
    <line x1="110" y1="270" x2="110" y2="295"/>
    <rect x="101" y="295" width="18" height="50" fill="#ffffff"/>
    <line x1="88" y1="352" x2="96" y2="352"/>
    <line x1="96" y1="352" x2="128" y2="290"/>
    <line x1="128" y1="290" x2="134" y2="290"/>
    <line x1="110" y1="345" x2="110" y2="370"/>
    <line x1="110" y1="370" x2="360" y2="370"/>
  </g>
  <g fill="#1a1a1a">
    <text x="40" y="315">B2</text>
    <text x="138" y="322">−ϑ</text>
    <text x="40" y="400">Temperaturfühler (NTC)</text>
  </g>

  <!-- Pinnummern am Steuergerät -->
  <g fill="#1a1a1a">
    <text x="366" y="64">12</text>
    <text x="366" y="114">13</text>
    <text x="366" y="164">14</text>
    <text x="366" y="264">20</text>
    <text x="366" y="364">21</text>
  </g>

  <!-- Innenschaltung: 5-V-Regler -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <rect x="530" y="45" width="80" height="50" fill="#ffffff"/>
    <line x1="360" y1="70" x2="530" y2="70"/>
    <!-- Pull-up R1 zum NTC-Eingang -->
    <line x1="570" y1="95" x2="570" y2="170"/>
    <rect x="561" y="170" width="18" height="50" fill="#ffffff"/>
    <line x1="570" y1="220" x2="570" y2="270"/>
    <line x1="360" y1="270" x2="570" y2="270"/>
    <!-- Auswertung Signal 1 -->
    <rect x="460" y="105" width="70" height="30" fill="#ffffff"/>
    <line x1="360" y1="120" x2="460" y2="120"/>
    <!-- Auswertung Signal 2 -->
    <line x1="495" y1="270" x2="495" y2="295"/>
    <rect x="460" y="295" width="70" height="30" fill="#ffffff"/>
    <!-- Sensormasse Pin 14 -->
    <line x1="360" y1="170" x2="420" y2="170"/>
    <line x1="420" y1="170" x2="420" y2="195"/>
    <line x1="406" y1="195" x2="434" y2="195"/>
    <line x1="410" y1="201" x2="430" y2="201"/>
    <line x1="415" y1="207" x2="425" y2="207"/>
    <!-- Sensormasse Pin 21 -->
    <line x1="360" y1="370" x2="420" y2="370"/>
    <line x1="420" y1="370" x2="420" y2="390"/>
    <line x1="406" y1="390" x2="434" y2="390"/>
    <line x1="410" y1="396" x2="430" y2="396"/>
    <line x1="415" y1="402" x2="425" y2="402"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="570" cy="270" r="4"/>
    <circle cx="495" cy="270" r="4"/>
    <text x="570" y="76" text-anchor="middle">5 V</text>
    <text x="554" y="192" text-anchor="end">R1</text>
    <text x="554" y="212" text-anchor="end">2,5 kΩ</text>
    <text x="495" y="126" text-anchor="middle">U₁</text>
    <text x="495" y="316" text-anchor="middle">U₂</text>
  </g>

  <!-- Messpunkte A–E (gegen Masse) -->
  <g fill="#c0392b">
    <circle cx="250" cy="70" r="4"/>
    <circle cx="250" cy="120" r="4"/>
    <circle cx="250" cy="170" r="4"/>
    <circle cx="250" cy="270" r="4"/>
    <circle cx="250" cy="370" r="4"/>
  </g>
  <g fill="#ffffff" stroke="#c0392b" stroke-width="2">
    <circle cx="250" cy="48" r="12"/>
    <circle cx="250" cy="98" r="12"/>
    <circle cx="250" cy="148" r="12"/>
    <circle cx="250" cy="248" r="12"/>
    <circle cx="250" cy="348" r="12"/>
  </g>
  <g fill="#c0392b" font-weight="bold" text-anchor="middle">
    <text x="250" y="53">A</text>
    <text x="250" y="103">B</text>
    <text x="250" y="153">C</text>
    <text x="250" y="253">D</text>
    <text x="250" y="353">E</text>
  </g>
</svg>
