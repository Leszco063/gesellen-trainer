<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Arial, sans-serif" font-size="15">
  <title>Schaltplan-Auszug Common-Rail-Motorsteuerung: Hauptrelais K1, Sicherungen F1 bis F3, Motorsteuergerät A1, Raildrucksensor B1, Kurbelwellengeber B2, Zumesseinheit Y1, Druckregelventil Y2, Injektoren Y3 und Y4, Messpunkte A, B, C</title>
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>

  <!-- Klemmen 30 und 15 -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M30 30 H620"/>
    <path d="M30 60 H60"/>
  </g>
  <g fill="#1a1a1a">
    <text x="4" y="35">30</text>
    <text x="4" y="65">15</text>
  </g>

  <!-- Hauptrelais K1 -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M60 60 V85"/>
    <rect x="40" y="85" width="40" height="30" fill="#ffffff"/>
    <path d="M40 115 L80 85"/>
    <path d="M60 115 V290"/>
    <path d="M110 30 V85"/>
    <path d="M110 85 L126 112"/>
    <path d="M110 118 V140 H520"/>
    <path d="M80 100 H117" stroke-dasharray="4 3"/>
  </g>
  <g fill="#1a1a1a">
    <text x="8" y="106">K1</text>
    <text x="64" y="80">86</text>
    <text x="64" y="134">85</text>
    <text x="114" y="80">30</text>
    <text x="86" y="135">87</text>
  </g>

  <!-- Legende -->
  <g fill="#1a1a1a">
    <text x="200" y="62">K1 Hauptrelais · F1 5 A · F2 15 A · F3 10 A</text>
    <text x="200" y="86">B1 Raildrucksensor · B2 Kurbelwellengeber</text>
    <text x="200" y="110">Y1 Zumesseinheit · Y2 Druckregelventil</text>
    <text x="200" y="128" font-size="15">Y3/Y4 Injektoren Zyl. 1/2</text>
  </g>

  <!-- F1: Dauerplus zum Steuergerät, Pin 1 -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M590 30 V45 M590 75 V290"/>
    <rect x="583" y="45" width="14" height="30" fill="#ffffff"/>
    <path d="M590 45 V75"/>
  </g>
  <text x="602" y="66" fill="#1a1a1a">F1</text>

  <!-- F3: Kl. 87 zum Steuergerät, Pin 2 -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M140 140 V155 M140 185 V290"/>
    <rect x="133" y="155" width="14" height="30" fill="#ffffff"/>
    <path d="M140 155 V185"/>
  </g>
  <text x="152" y="176" fill="#1a1a1a">F3</text>

  <!-- F2: Kl. 87 zu Y1 und Y2 (Plus) -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M455 140 V150 M455 180 V200"/>
    <rect x="448" y="150" width="14" height="30" fill="#ffffff"/>
    <path d="M455 150 V180"/>
    <path d="M410 200 H500 M410 200 V215 M500 200 V215"/>
  </g>
  <text x="424" y="172" fill="#1a1a1a">F2</text>
  <g fill="#1a1a1a">
    <circle cx="455" cy="200" r="3.5"/>
    <circle cx="110" cy="30" r="3.5"/>
    <circle cx="590" cy="30" r="3.5"/>
    <circle cx="140" cy="140" r="3.5"/>
    <circle cx="455" cy="140" r="3.5"/>
  </g>

  <!-- Y1 Zumesseinheit und Y2 Druckregelventil (Magnetventile) -->
  <g stroke="#1a1a1a" stroke-width="2" fill="#ffffff">
    <rect x="396" y="215" width="28" height="40"/>
    <rect x="486" y="215" width="28" height="40"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M396 255 L424 215"/>
    <path d="M486 255 L514 215"/>
    <path d="M410 255 V290"/>
    <path d="M500 255 V290"/>
  </g>
  <g fill="#1a1a1a">
    <text x="430" y="232">Y1</text>
    <text x="520" y="232">Y2</text>
  </g>

  <!-- B1 Raildrucksensor, 3-polig -->
  <rect x="200" y="190" width="140" height="58" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="270" y="213" text-anchor="middle" fill="#1a1a1a">B1 Raildruck</text>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="232" y="242">1</text>
    <text x="282" y="242">2</text>
    <text x="332" y="242">3</text>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M220 248 V290 M270 248 V290 M320 248 V290"/>
  </g>

  <!-- A1 Motorsteuergerät -->
  <rect x="30" y="290" width="580" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="336" text-anchor="middle" fill="#1a1a1a" font-weight="bold">A1 Motorsteuergerät</text>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="60" y="310">4</text>
    <text x="140" y="310">2</text>
    <text x="220" y="310">20</text>
    <text x="270" y="310">21</text>
    <text x="320" y="310">22</text>
    <text x="410" y="310">30</text>
    <text x="500" y="310">31</text>
    <text x="590" y="310">1</text>
    <text x="60" y="355">3</text>
    <text x="160" y="355">40</text>
    <text x="210" y="355">41</text>
    <text x="290" y="355">42</text>
    <text x="340" y="355">43</text>
    <text x="470" y="355">50</text>
    <text x="520" y="355">51</text>
  </g>

  <!-- Masse Steuergerät (Pin 3) -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M60 360 V420"/>
    <path d="M44 420 H76 M50 427 H70 M56 434 H64"/>
  </g>
  <text x="66" y="410" fill="#1a1a1a">31</text>

  <!-- Injektoren Y3, Y4 (plus- und masseseitig vom Steuergerät) -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M160 360 V390 M210 360 V390 M290 360 V390 M340 360 V390"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="#ffffff">
    <rect x="150" y="390" width="70" height="36"/>
    <rect x="280" y="390" width="70" height="36"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="185" y="413">Y3</text>
    <text x="315" y="413">Y4</text>
    <text x="185" y="448">Zyl. 1</text>
    <text x="315" y="448">Zyl. 2</text>
  </g>

  <!-- B2 Kurbelwellengeber (induktiv, 2-polig) -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M470 360 V390 M520 360 V390"/>
  </g>
  <rect x="450" y="390" width="90" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="495" y="413" text-anchor="middle" fill="#1a1a1a">B2 n</text>
  <text x="495" y="448" text-anchor="middle" fill="#1a1a1a">KW-Geber</text>

  <!-- Messpunkte A, B, C -->
  <g fill="#c0392b">
    <circle cx="270" cy="272" r="3.5"/>
    <circle cx="410" cy="274" r="3.5"/>
    <circle cx="455" cy="188" r="3.5"/>
  </g>
  <g stroke="#c0392b" stroke-width="2" fill="#ffffff">
    <circle cx="294" cy="272" r="11"/>
    <circle cx="434" cy="274" r="11"/>
    <circle cx="479" cy="186" r="11"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.5">
    <path d="M273 272 H283 M413 274 H423 M458 188 H468"/>
  </g>
  <g fill="#c0392b" font-weight="bold" text-anchor="middle">
    <text x="294" y="277">A</text>
    <text x="434" y="279">B</text>
    <text x="479" y="191">C</text>
  </g>
</svg>
