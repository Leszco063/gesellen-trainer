  <!-- Wendepunkte -->
  <circle cx="154" cy="329" r="6" fill="#c0392b"/>
  <text x="130" y="337" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">A</text>
  <circle cx="366" cy="147" r="6" fill="#c0392b"/>
  <text x="392" y="153" text-anchor="middle" font-size="18" font-weight="bold" fill="#c0392b">B</text>

  <!-- Phasen -->
  <circle cx="248" cy="318" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="248" y="324" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">1</text><circle cx="366" cy="113" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="366" y="119" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">2</text><circle cx="425" cy="234" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="425" y="240" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">3</text><circle cx="514" cy="257" r="15" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="514" y="263" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">4</text>

  <!-- Legende -->
  <line x1="90" y1="404" x2="130" y2="404" stroke="#1a1a1a" stroke-width="3"/>
  <text x="138" y="409" fill="#1a1a1a">tatsächliche Entwicklung</text>
  <line x1="350" y1="404" x2="390" y2="404" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="398" y="409" fill="#1a1a1a">Trend (langfristig)</text>
</svg>
