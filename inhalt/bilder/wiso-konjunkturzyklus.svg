<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, sans-serif" font-size="16">
  <title>Konjunkturverlauf im Modell: reales BIP über der Zeit mit Trendlinie, Phasen 1 bis 4 und Wendepunkten A und B</title>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Konjunkturverlauf (Modell)</text>

  <!-- Achsen -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <path d="M70 360 H620"/>
    <path d="M70 360 V48"/>
  </g>
  <path d="M620 355 L630 360 L620 365 Z" fill="#1a1a1a"/>
  <path d="M65 48 L70 38 L75 48 Z" fill="#1a1a1a"/>
