<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Arial, sans-serif" font-size="15">
  <title>Airbag-Zündkreise (Beispiel-Schaltplan): Steuergerät A1 mit Pins 1 bis 19, Wickelfeder, Fahrerairbag zweistufig, Beifahrerairbag, Gurtstraffer, Seitenairbag über Sitzstecker, Versorgung, Kontrollleuchte, Satellitensensoren, CAN; Nummern 1 bis 6, Trennstellen A und B</title>
  <!-- Selbst gezeichnet. Pinnummern und Bezeichnungen sind Beispiele.
       1 Wickelfeder, 2 Steckverbindung unter dem Sitz, 3 Sicherung F12, 4 Kontrollleuchte H1,
       5 Upfront-Sensor (vorn), 6 Seitenaufprallsensor (Tür). A = Stecker am Fahrerairbag, B = Stecker Wickelfeder/Lenksäule -->
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>

  <!-- Leitungen links: Zündkreise -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <path d="M260 85 H35 V91 M35 109 V115 H260"/>
    <path d="M260 160 H35 V166 M35 184 V190 H260"/>
    <path d="M260 245 H35 V251 M35 269 V275 H260"/>
    <path d="M260 320 H35 V326 M35 344 V350 H260"/>
    <path d="M260 400 H35 V406 M35 424 V430 H260"/>
  </g>
  <!-- Zündpillen (Widerstand) -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="27" y="91" width="16" height="18"/>
    <rect x="27" y="166" width="16" height="18"/>
    <rect x="27" y="251" width="16" height="18"/>
    <rect x="27" y="326" width="16" height="18"/>
    <rect x="27" y="406" width="16" height="18"/>
  </g>
  <g fill="#1a1a1a">
    <text x="52" y="105">Stufe 1</text>
    <text x="52" y="180">Stufe 2</text>
    <text x="52" y="265">Beifahrerairbag</text>
    <text x="52" y="340">Gurtstraffer</text>
    <text x="52" y="420">Seitenairbag</text>
    <text x="18" y="62">Fahrerairbag</text>
  </g>
  <rect x="15" y="70" width="127" height="135" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Trennstellen A und B (Stecker) -->
  <g stroke="#c0392b" stroke-width="2" fill="none">
    <line x1="157" y1="72" x2="157" y2="203" stroke-dasharray="5 4"/>
    <line x1="237" y1="72" x2="237" y2="203" stroke-dasharray="5 4"/>
    <line x1="157" y1="59" x2="157" y2="72"/>
    <line x1="237" y1="59" x2="237" y2="72"/>
  </g>
  <g font-weight="bold" text-anchor="middle">
    <circle cx="157" cy="48" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="157" y="53" fill="#c0392b">A</text>
    <circle cx="237" cy="48" r="11" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="237" y="53" fill="#c0392b">B</text>
  </g>

  <!-- Wickelfeder (1) -->
  <rect x="175" y="72" width="40" height="131" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M195 137 m-4 0 a4 4 0 1 1 8 0 a8 8 0 1 1 -16 0 a12 12 0 1 1 24 0" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="195" y1="59" x2="195" y2="72" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Steckverbindung unter dem Sitz (2) -->
  <rect x="180" y="390" width="24" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="192" y1="390" x2="192" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="192" y1="440" x2="192" y2="456" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Steuergerät A1 -->
  <rect x="260" y="60" width="150" height="395" fill="#f2f2f2" stroke="#1a1a1a" stroke-width="2"/>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="335" y="230" font-weight="bold">A1</text>
    <text x="335" y="255">Airbag-</text>
    <text x="335" y="275">Steuer-</text>
    <text x="335" y="295">gerät</text>
  </g>
  <g fill="#1a1a1a">
    <text x="266" y="90">1</text><text x="266" y="120">2</text>
    <text x="266" y="165">3</text><text x="266" y="195">4</text>
    <text x="266" y="250">5</text><text x="266" y="280">6</text>
    <text x="266" y="325">7</text><text x="266" y="355">8</text>
    <text x="266" y="405">9</text><text x="266" y="435">10</text>
  </g>
  <g fill="#1a1a1a" text-anchor="end">
    <text x="404" y="90">11</text><text x="404" y="135">12</text>
    <text x="404" y="205">13</text>
    <text x="404" y="255">14</text><text x="404" y="285">15</text>
    <text x="404" y="325">16</text><text x="404" y="355">17</text>
    <text x="404" y="405">18</text><text x="404" y="435">19</text>
  </g>

  <!-- Rechts: Versorgung, Masse, Kontrollleuchte, Sensoren, CAN -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <path d="M410 85 H450 M490 85 H595"/>
    <path d="M410 130 H445 V150 M432 150 H458 M437 156 H453 M442 162 H448"/>
    <path d="M565 85 V138 M565 162 V200 H410"/>
    <path d="M410 250 H505 M410 280 H505"/>
    <path d="M410 320 H505 M410 350 H505"/>
    <path d="M410 400 H520 M410 430 H520"/>
  </g>
  <circle cx="565" cy="85" r="3.5" fill="#1a1a1a"/>
  <!-- Sicherung F12 (3) -->
  <rect x="450" y="78" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="450" y1="85" x2="490" y2="85" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="470" y1="66" x2="470" y2="78" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Kontrollleuchte H1 (4) -->
  <circle cx="565" cy="150" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="556.5" y1="141.5" x2="573.5" y2="158.5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="573.5" y1="141.5" x2="556.5" y2="158.5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="577" y1="150" x2="594" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Sensoren (5) und (6) -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="505" y="235" width="60" height="60"/>
    <rect x="505" y="305" width="60" height="60"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="513" y1="287" x2="553" y2="247"/>
    <line x1="513" y1="357" x2="553" y2="317"/>
  </g>
  <polygon points="557,243 545,248 552,255" fill="#1a1a1a"/>
  <polygon points="557,313 545,318 552,325" fill="#1a1a1a"/>
  <g stroke="#1a1a1a" stroke-width="1.5">
    <line x1="565" y1="265" x2="594" y2="265"/>
    <line x1="565" y1="335" x2="594" y2="335"/>
  </g>

  <g fill="#1a1a1a">
    <text x="600" y="90">15</text>
    <text x="465" y="160">31</text>
    <text x="456" y="112">F12</text>
    <text x="528" y="135">H1</text>
    <text x="440" y="243">vorn</text>
    <text x="440" y="313">Tür</text>
    <text x="526" y="405">CAN-H</text>
    <text x="526" y="435">CAN-L</text>
  </g>

  <!-- Nummern -->
  <g font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    <circle cx="195" cy="48" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="195" y="53">1</text>
    <circle cx="192" cy="467" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="192" y="472">2</text>
    <circle cx="470" cy="55" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="470" y="60">3</text>
    <circle cx="605" cy="150" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="605" y="155">4</text>
    <circle cx="605" cy="265" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="605" y="270">5</text>
    <circle cx="605" cy="335" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="605" y="340">6</text>
  </g>
</svg>
