<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif" font-size="14">
  <title>ESP- und EPB-Komponenten im Fahrzeug (Draufsicht, schematisch)</title>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- Fahrtrichtung -->
  <text x="250" y="36" font-size="15" fill="#1a1a1a">Fahrtrichtung</text>
  <line x1="350" y1="31" x2="410" y2="31" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="410,25 422,31 410,37" fill="#1a1a1a"/>

  <!-- Karosserie, Stirnwand/Windschutzscheibe -->
  <rect x="60" y="80" width="520" height="240" rx="50" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 410 96 Q 422 200 410 304" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Räder -->
  <rect x="125" y="62" width="70" height="34" rx="5" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="125" y="304" width="70" height="34" rx="5" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="445" y="62" width="70" height="34" rx="5" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="445" y="304" width="70" height="34" rx="5" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Bremsleitungen -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <line x1="476" y1="183" x2="476" y2="220"/>
    <polyline points="540,232 560,232 560,110 505,96"/>
    <line x1="510" y1="262" x2="510" y2="304"/>
    <polyline points="470,250 178,250"/>
    <line x1="178" y1="250" x2="178" y2="114"/>
    <line x1="178" y1="250" x2="178" y2="286"/>
  </g>
  <line x1="178" y1="114" x2="178" y2="96" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="178" y1="286" x2="178" y2="304" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Raddrehzahlsensoren (je Rad) -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="152" y="100" width="14" height="14"/>
    <rect x="152" y="286" width="14" height="14"/>
    <rect x="473" y="100" width="14" height="14"/>
    <rect x="473" y="286" width="14" height="14"/>
  </g>

  <!-- EPB-Stellmotoren an den hinteren Bremssätteln -->
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="195" y1="88" x2="206" y2="104"/>
    <line x1="195" y1="312" x2="206" y2="296"/>
    <circle cx="214" cy="110" r="10" fill="#ffffff"/>
    <circle cx="214" cy="290" r="10" fill="#ffffff"/>
  </g>
  <text x="214" y="115" font-size="13" text-anchor="middle" fill="#1a1a1a">M</text>
  <text x="214" y="295" font-size="13" text-anchor="middle" fill="#1a1a1a">M</text>

  <!-- Lenkrad mit Lenksäule und Sensor -->
  <ellipse cx="370" cy="128" rx="6" ry="24" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="376" y1="128" x2="410" y2="128" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="382" y="121" width="16" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Bremskraftverstärker, Hauptbremszylinder, Behälter, Drucksensor -->
  <circle cx="432" cy="175" r="20" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="452" y="167" width="48" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="462" y="153" width="28" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="500" y="168" width="18" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="509" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a">p</text>

  <!-- Hydroaggregat mit Steuergerät -->
  <rect x="470" y="220" width="70" height="42" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="488" cy="241" r="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="488" y="246" font-size="13" text-anchor="middle" fill="#1a1a1a">M</text>
  <rect x="506" y="227" width="28" height="28" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Gierraten-/Querbeschleunigungssensor -->
  <rect x="263" y="178" width="34" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 272 196 A 9 9 0 1 1 288 196" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- EPB-Taster -->
  <rect x="335" y="183" width="20" height="14" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="190" x2="350" y2="190" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Hinweislinien -->
  <g stroke="#1a1a1a" stroke-width="1.5">
    <line x1="121" y1="122" x2="152" y2="108"/>
    <line x1="121" y1="278" x2="152" y2="292"/>
    <line x1="451" y1="122" x2="473" y2="110"/>
    <line x1="451" y1="278" x2="473" y2="290"/>
    <line x1="545" y1="241" x2="540" y2="241"/>
    <line x1="390" y1="111" x2="390" y2="121"/>
    <line x1="280" y1="161" x2="280" y2="178"/>
    <line x1="532" y1="152" x2="512" y2="168"/>
    <line x1="241" y1="126" x2="224" y2="114"/>
    <line x1="241" y1="274" x2="224" y2="286"/>
    <line x1="345" y1="161" x2="345" y2="183"/>
  </g>

  <!-- Nummern -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <circle cx="110" cy="127" r="11"/>
    <circle cx="110" cy="273" r="11"/>
    <circle cx="440" cy="127" r="11"/>
    <circle cx="440" cy="273" r="11"/>
    <circle cx="556" cy="241" r="11"/>
    <circle cx="390" cy="100" r="11"/>
    <circle cx="280" cy="150" r="11"/>
    <circle cx="540" cy="143" r="11"/>
    <circle cx="250" cy="132" r="11"/>
    <circle cx="250" cy="268" r="11"/>
    <circle cx="345" cy="150" r="11"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    <text x="110" y="132">1</text>
    <text x="110" y="278">1</text>
    <text x="440" y="132">1</text>
    <text x="440" y="278">1</text>
    <text x="556" y="246">2</text>
    <text x="390" y="105">3</text>
    <text x="280" y="155">4</text>
    <text x="540" y="148">5</text>
    <text x="250" y="137">6</text>
    <text x="250" y="273">6</text>
    <text x="345" y="155">7</text>
  </g>

  <!-- Legende -->
  <line x1="60" y1="370" x2="100" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <text x="110" y="375" fill="#1a1a1a">Bremsleitung</text>
  <text x="240" y="375" fill="#1a1a1a">elektrische Leitungen nicht dargestellt</text>
</svg>
