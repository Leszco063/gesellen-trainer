<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif" font-size="15">
  <title>Elektrische Parkbremse: Schaltplan mit Taster S1, Steuergerät A1 (Pins 1 bis 15), Sicherungen F1 bis F3, Stellmotoren M1 und M2, Messpunkte A bis D</title>
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>

  <!-- Klemmen -->
  <g fill="#1a1a1a" font-weight="bold">
    <text x="10" y="50">30</text>
    <text x="10" y="80">15</text>
    <text x="10" y="430">31</text>
  </g>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="40" y1="45" x2="620" y2="45"/>
    <line x1="40" y1="75" x2="290" y2="75"/>
    <line x1="40" y1="425" x2="620" y2="425"/>
    <!-- Zuleitungen zu den Sicherungen und zum Steuergerät -->
    <line x1="270" y1="75" x2="270" y2="150"/>
    <line x1="330" y1="45" x2="330" y2="150"/>
    <line x1="400" y1="45" x2="400" y2="150"/>
    <!-- Masse Pin 4 -->
    <line x1="290" y1="345" x2="290" y2="425"/>
    <!-- CAN Pins 14/15 -->
    <line x1="380" y1="345" x2="380" y2="395"/>
    <line x1="410" y1="345" x2="410" y2="395"/>
    <!-- Stellmotoren -->
    <line x1="470" y1="200" x2="575" y2="200"/>
    <line x1="470" y1="232" x2="575" y2="232"/>
    <line x1="470" y1="282" x2="575" y2="282"/>
    <line x1="470" y1="314" x2="575" y2="314"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="270" cy="75" r="4"/>
    <circle cx="330" cy="45" r="4"/>
    <circle cx="400" cy="45" r="4"/>
    <circle cx="290" cy="425" r="4"/>
  </g>

  <!-- Sicherungen (Rechteck mit Längsstrich) -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="263" y="90" width="14" height="30"/>
    <rect x="323" y="90" width="14" height="30"/>
    <rect x="393" y="90" width="14" height="30"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="270" y1="90" x2="270" y2="120"/>
    <line x1="330" y1="90" x2="330" y2="120"/>
    <line x1="400" y1="90" x2="400" y2="120"/>
  </g>
  <g fill="#1a1a1a">
    <text x="282" y="103">F3</text><text x="282" y="120">5 A</text>
    <text x="342" y="103">F1</text><text x="342" y="120">30 A</text>
    <text x="412" y="103">F2</text><text x="412" y="120">30 A</text>
    <text x="468" y="103">F1: Endstufe M1</text>
    <text x="468" y="122">F2: Endstufe M2</text>
  </g>

  <!-- Steuergerät A1 -->
  <rect x="230" y="150" width="240" height="195" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <g fill="#1a1a1a">
    <text x="270" y="168" text-anchor="middle">3</text>
    <text x="330" y="168" text-anchor="middle">1</text>
    <text x="400" y="168" text-anchor="middle">2</text>
    <text x="238" y="205">5</text>
    <text x="238" y="230">6</text>
    <text x="238" y="280">7</text>
    <text x="238" y="305">8</text>
    <text x="238" y="330">9</text>
    <text x="290" y="338" text-anchor="middle">4</text>
    <text x="380" y="338" text-anchor="middle">14</text>
    <text x="410" y="338" text-anchor="middle">15</text>
    <text x="464" y="195" text-anchor="end">10</text>
    <text x="464" y="250" text-anchor="end">11</text>
    <text x="464" y="277" text-anchor="end">12</text>
    <text x="464" y="332" text-anchor="end">13</text>
    <text x="300" y="235" text-anchor="middle" font-weight="bold">A1</text>
    <text x="300" y="255" text-anchor="middle">EPB-</text>
    <text x="300" y="273" text-anchor="middle">Steuergerät</text>
  </g>
  <!-- Endstufen (H-Brücken) zur Polwendung -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="368" y="196" width="88" height="40"/>
    <rect x="368" y="278" width="88" height="40"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="456" y1="200" x2="470" y2="200"/>
    <line x1="456" y1="232" x2="470" y2="232"/>
    <line x1="456" y1="282" x2="470" y2="282"/>
    <line x1="456" y1="314" x2="470" y2="314"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="412" y="221">H-Brücke</text>
    <text x="412" y="303">H-Brücke</text>
  </g>

  <!-- Taster S1 mit vier Kontakten -->
  <rect x="20" y="165" width="170" height="180" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="40" y1="200" x2="40" y2="325"/>
    <line x1="40" y1="325" x2="230" y2="325"/>
    <path d="M40 200 H60 L88 187 M92 194 V200 H230"/>
    <path d="M40 225 H60 L88 212 M92 219 V225 H230"/>
    <path d="M40 275 H60 L88 262 M92 269 V275 H230"/>
    <path d="M40 300 H60 L88 287 M92 294 V300 H230"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="40" cy="225" r="3.5"/>
    <circle cx="40" cy="275" r="3.5"/>
    <circle cx="40" cy="300" r="3.5"/>
    <text x="100" y="188">Schließen</text>
    <text x="100" y="262">Lösen</text>
    <text x="105" y="365" text-anchor="middle">S1 EPB-Taster</text>
  </g>

  <!-- Stellmotoren M1, M2 -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <circle cx="575" cy="216" r="24"/>
    <circle cx="575" cy="298" r="24"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="575" y="222" font-weight="bold" font-size="17">M</text>
    <text x="575" y="304" font-weight="bold" font-size="17">M</text>
    <text x="575" y="184">M1 hinten links</text>
    <text x="575" y="342">M2 hinten rechts</text>
    <text x="395" y="413">CAN zum ESP</text>
  </g>

  <!-- Messpunkte A bis D (Akzentfarbe) -->
  <g fill="#ffffff" stroke="#c0392b" stroke-width="2">
    <circle cx="525" cy="200" r="10"/>
    <circle cx="525" cy="232" r="10"/>
    <circle cx="330" cy="135" r="10"/>
    <circle cx="290" cy="385" r="10"/>
  </g>
  <g fill="#c0392b" font-weight="bold" text-anchor="middle">
    <text x="525" y="205">A</text>
    <text x="525" y="237">B</text>
    <text x="330" y="140">C</text>
    <text x="290" y="390">D</text>
  </g>

  <text x="630" y="452" text-anchor="end" fill="#1a1a1a">Pins und Sicherungen: Beispielwerte</text>
</svg>
