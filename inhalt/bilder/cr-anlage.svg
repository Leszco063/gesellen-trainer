<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, sans-serif" font-size="14">
  <title>Common-Rail-Anlage mit Zweisteller-Regelung (Schema, Nummern 1 bis 11)</title>
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>

  <!-- Tank -->
  <rect x="20" y="300" width="230" height="85" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="378" fill="#1a1a1a">Tank</text>

  <!-- Niederdruck (durchgezogen) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <path d="M70 329 V245 H97"/>
    <path d="M133 245 H268"/>
    <path d="M190 245 V229"/>
  </g>

  <!-- Vorförderpumpe (1) im Tank -->
  <circle cx="70" cy="345" r="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M70 332 L79 347 H61 Z" fill="#1a1a1a"/>

  <!-- Kraftstofffilter (2) -->
  <path d="M115 227 L133 245 L115 263 L97 245 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="115" y1="229" x2="115" y2="261" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Niederdruck-Temperatur-/Druckgeber (3) -->
  <rect x="173" y="205" width="34" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="222" text-anchor="middle" fill="#1a1a1a">p/T</text>

  <!-- Zumesseinheit (5) an der Pumpe: Magnetventil -->
  <rect x="268" y="233" width="32" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="272" y1="253" x2="296" y2="237" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Hochdruckpumpe (4) -->
  <rect x="300" y="215" width="80" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="340" cy="245" r="18" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M340 231 L349 246 H331 Z" fill="#1a1a1a"/>
  <path d="M332 252 H348" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Hochdruck (dicke Doppellinie) -->
  <g fill="none" stroke-linejoin="miter">
    <path d="M340 215 V195 H235 V62 M260 62 V86 M320 62 V86 M380 62 V86 M440 62 V86" stroke="#1a1a1a" stroke-width="7"/>
    <path d="M340 216 V195 H235 V61 M260 61 V87 M320 61 V87 M380 61 V87 M440 61 V87" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Rail (6) -->
  <rect x="220" y="40" width="280" height="22" rx="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Raildrucksensor (7) -->
  <rect x="188" y="39" width="32" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="204" y="56" text-anchor="middle" fill="#1a1a1a">p</text>

  <!-- Druckregelventil (8): Magnetventil -->
  <rect x="500" y="38" width="36" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="505" y1="59" x2="531" y2="43" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Injektoren (9) -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="251" y="86" width="18" height="54"/><path d="M253 140 L260 154 L267 140 Z"/>
    <rect x="311" y="86" width="18" height="54"/><path d="M313 140 L320 154 L327 140 Z"/>
    <rect x="371" y="86" width="18" height="54"/><path d="M373 140 L380 154 L387 140 Z"/>
    <rect x="431" y="86" width="18" height="54"/><path d="M433 140 L440 154 L447 140 Z"/>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <line x1="254" y1="104" x2="266" y2="104"/><line x1="314" y1="104" x2="326" y2="104"/>
    <line x1="374" y1="104" x2="386" y2="104"/><line x1="434" y1="104" x2="446" y2="104"/>
  </g>

  <!-- Rücklauf (gestrichelt) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8 5">
    <path d="M269 100 H278 V175"/>
    <path d="M329 100 H338 V175"/>
    <path d="M389 100 H398 V175"/>
    <path d="M449 100 H458 V175"/>
    <path d="M278 175 H580"/>
    <path d="M536 51 H580 V205"/>
    <path d="M580 255 V360 H250"/>
    <path d="M380 265 H530 V360"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="338" cy="175" r="3.5"/><circle cx="398" cy="175" r="3.5"/>
    <circle cx="458" cy="175" r="3.5"/><circle cx="580" cy="175" r="3.5"/>
    <circle cx="530" cy="360" r="3.5"/>
  </g>

  <!-- Kraftstoffkühler (11) -->
  <rect x="560" y="205" width="40" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M566 215 H594 M566 225 H594 M566 235 H594 M566 245 H594" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Nummern mit Hinweislinien -->
  <g stroke="#1a1a1a" stroke-width="1.5">
    <line x1="99" y1="345" x2="86" y2="345"/>
    <line x1="115" y1="269" x2="115" y2="263"/>
    <line x1="166" y1="210" x2="173" y2="213"/>
    <line x1="340" y1="289" x2="340" y2="275"/>
    <line x1="280" y1="279" x2="283" y2="257"/>
    <line x1="360" y1="33" x2="360" y2="40"/>
    <line x1="192" y1="29" x2="198" y2="39"/>
    <line x1="550" y1="31" x2="530" y2="38"/>
    <line x1="474" y1="122" x2="449" y2="122"/>
    <line x1="430" y1="369" x2="430" y2="360"/>
    <line x1="609" y1="230" x2="600" y2="230"/>
  </g>
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <circle cx="110" cy="345" r="11"/>
    <circle cx="115" cy="280" r="11"/>
    <circle cx="155" cy="205" r="11"/>
    <circle cx="340" cy="300" r="11"/>
    <circle cx="278" cy="290" r="11"/>
    <circle cx="360" cy="22" r="11"/>
    <circle cx="186" cy="19" r="11"/>
    <circle cx="561" cy="25" r="11"/>
    <circle cx="485" cy="122" r="11"/>
    <circle cx="430" cy="380" r="11"/>
    <circle cx="620" cy="230" r="11"/>
  </g>
  <g fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="110" y="350">1</text>
    <text x="115" y="285">2</text>
    <text x="155" y="210">3</text>
    <text x="340" y="305">4</text>
    <text x="278" y="295">5</text>
    <text x="360" y="27">6</text>
    <text x="186" y="24">7</text>
    <text x="561" y="30">8</text>
    <text x="485" y="127">9</text>
    <text x="430" y="385">10</text>
    <text x="620" y="235">11</text>
  </g>

  <!-- Legende -->
  <g fill="#1a1a1a" font-size="14">
    <line x1="398" y1="295" x2="428" y2="295" stroke="#1a1a1a" stroke-width="2"/>
    <text x="434" y="300">Niederdruck</text>
    <line x1="398" y1="317" x2="428" y2="317" stroke="#1a1a1a" stroke-width="7"/>
    <line x1="397" y1="317" x2="429" y2="317" stroke="#ffffff" stroke-width="2.5"/>
    <text x="434" y="322">Hochdruck</text>
    <line x1="398" y1="339" x2="428" y2="339" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="434" y="344">Rücklauf</text>
  </g>
</svg>
