<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Arial, sans-serif" font-size="15">
  <title>ESP-Hydraulik eines Bremskreises (Diagonalaufteilung) mit nummerierten Bauteilen 1 bis 12</title>
  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>

  <!-- Leitungen -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <line x1="80" y1="70" x2="80" y2="165"/>
    <line x1="80" y1="110" x2="200" y2="110"/>
    <line x1="250" y1="110" x2="530" y2="110"/>
    <line x1="150" y1="110" x2="150" y2="135"/>
    <path d="M80 209 V310 H330"/>
    <line x1="330" y1="110" x2="330" y2="228"/>
    <line x1="330" y1="272" x2="330" y2="350"/>
    <line x1="273" y1="250" x2="308" y2="250"/>
    <path d="M250 365 V350 H530"/>
    <!-- Rad vorn links -->
    <line x1="400" y1="110" x2="400" y2="148"/>
    <line x1="400" y1="192" x2="400" y2="258"/>
    <line x1="400" y1="215" x2="425" y2="215"/>
    <line x1="400" y1="302" x2="400" y2="350"/>
    <!-- Rad hinten rechts -->
    <line x1="530" y1="110" x2="530" y2="148"/>
    <line x1="530" y1="192" x2="530" y2="258"/>
    <line x1="530" y1="215" x2="555" y2="215"/>
    <line x1="530" y1="302" x2="530" y2="350"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="80" cy="110" r="4"/>
    <circle cx="150" cy="110" r="4"/>
    <circle cx="330" cy="110" r="4"/>
    <circle cx="400" cy="110" r="4"/>
    <circle cx="400" cy="215" r="4"/>
    <circle cx="530" cy="215" r="4"/>
    <circle cx="330" cy="310" r="4"/>
    <circle cx="330" cy="350" r="4"/>
    <circle cx="400" cy="350" r="4"/>
  </g>

  <!-- Hauptbremszylinder mit Behälter (1) -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="30" y="38" width="120" height="32"/>
    <rect x="60" y="14" width="60" height="24"/>
  </g>
  <line x1="6" y1="54" x2="30" y2="54" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Drucksensor (12) -->
  <rect x="135" y="135" width="30" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="150" y="153" text-anchor="middle" fill="#1a1a1a">p</text>

  <!-- Magnetventile (Rechteck mit Schrägstrich): 2, 3, 6, 7, 8, 9 -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="200" y="95" width="50" height="30"/>
    <rect x="65" y="165" width="30" height="44"/>
    <rect x="385" y="148" width="30" height="44"/>
    <rect x="385" y="258" width="30" height="44"/>
    <rect x="515" y="148" width="30" height="44"/>
    <rect x="515" y="258" width="30" height="44"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="206" y1="120" x2="244" y2="100"/>
    <line x1="70" y1="204" x2="90" y2="170"/>
    <line x1="390" y1="187" x2="410" y2="153"/>
    <line x1="390" y1="297" x2="410" y2="263"/>
    <line x1="520" y1="187" x2="540" y2="153"/>
    <line x1="520" y1="297" x2="540" y2="263"/>
  </g>

  <!-- Rückförderpumpe (4) mit Motor -->
  <circle cx="330" cy="250" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M330 234 L340 252 H320 Z" fill="#1a1a1a"/>
  <circle cx="255" cy="250" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="255" y="256" text-anchor="middle" font-weight="bold" fill="#1a1a1a">M</text>

  <!-- Niederdruckspeicher (5) -->
  <rect x="222" y="365" width="56" height="45" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M232 380 H268 M232 380 L240 388 L248 380 L256 388 L264 380 L268 384" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="226" y1="396" x2="274" y2="396" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Radbremsen (10, 11) -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <rect x="425" y="200" width="60" height="30"/>
    <rect x="555" y="200" width="60" height="30"/>
  </g>
  <g fill="#1a1a1a" text-anchor="middle">
    <text x="455" y="221">VL</text>
    <text x="585" y="221">HR</text>
  </g>

  <!-- Nummern -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <circle cx="172" cy="50" r="12"/>
    <circle cx="225" cy="78" r="12"/>
    <circle cx="45" cy="187" r="12"/>
    <circle cx="370" cy="236" r="12"/>
    <circle cx="198" cy="388" r="12"/>
    <circle cx="366" cy="170" r="12"/>
    <circle cx="366" cy="280" r="12"/>
    <circle cx="496" cy="170" r="12"/>
    <circle cx="496" cy="280" r="12"/>
    <circle cx="455" cy="252" r="12"/>
    <circle cx="585" cy="252" r="12"/>
    <circle cx="187" cy="155" r="12"/>
  </g>
  <g fill="#1a1a1a" font-weight="bold" text-anchor="middle">
    <text x="172" y="55">1</text>
    <text x="225" y="83">2</text>
    <text x="45" y="192">3</text>
    <text x="370" y="241">4</text>
    <text x="198" y="393">5</text>
    <text x="366" y="175">6</text>
    <text x="366" y="285">7</text>
    <text x="496" y="175">8</text>
    <text x="496" y="285">9</text>
    <text x="455" y="257">10</text>
    <text x="585" y="257">11</text>
    <text x="187" y="160">12</text>
  </g>

  <text x="20" y="445" fill="#1a1a1a">Ein Bremskreis (Diagonalaufteilung): vorn links VL, hinten rechts HR</text>
</svg>
