<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Arial, sans-serif" font-size="15">
  <title>SCR-Anlage eines Pkw (Schema): Abgasstrang mit Katalysatoren, Sensoren und Dosierventil, AdBlue-Tank mit Fördermodul und Heizung, Nummern 1 bis 10</title>
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <!-- AdBlue-Tank mit Fördermodul (8) und Heizung (9) -->
  <rect x="20" y="30" width="210" height="110" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="30" y="52" fill="#1a1a1a">AdBlue-Tank</text>
  <rect x="140" y="62" width="75" height="68" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="177" cy="100" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M177 86 L186 102 H168 Z" fill="#1a1a1a"/>
  <rect x="35" y="108" width="85" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M42 124 L50 112 L58 124 L66 112 L74 124 L82 112 L90 124 L98 112 L106 124 L114 112" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Beheizte Dosierleitung (10) -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <path d="M215 75 H400 V165"/>
  </g>
  <path d="M232 82 H393 V165" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Motor und Abgasrohr -->
  <rect x="20" y="180" width="60" height="80" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="50" y="225" text-anchor="middle" fill="#1a1a1a">Motor</text>
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <path d="M80 200 H100 M170 200 H185 M265 200 H470 M550 200 H630"/>
    <path d="M80 240 H100 M170 240 H185 M265 240 H470 M550 240 H630"/>
  </g>
  <path d="M612 212 L628 220 L612 228 Z" fill="#1a1a1a"/>
  <text x="575" y="192" fill="#1a1a1a">Abgas</text>

  <!-- Oxidationskatalysator (1) -->
  <rect x="100" y="185" width="70" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M112 195 V245 M124 195 V245 M136 195 V245 M148 195 V245 M160 195 V245" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Dieselpartikelfilter (2) -->
  <rect x="185" y="185" width="80" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M185 205 L205 185 M185 225 L225 185 M185 245 L245 185 M195 255 L265 185 M215 255 L265 205 M235 255 L265 225 M255 255 L265 245" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Abgastemperatursensor (3) und NOx-Sensor 1 (4) unten am Rohr -->
  <rect x="286" y="240" width="18" height="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="326" y="240" width="18" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Dosierventil (5) oben mit Sprühkegel -->
  <rect x="390" y="165" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M400 202 L384 234 M400 202 L400 236 M400 202 L416 234" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Mischer -->
  <path d="M432 204 L442 236 M446 204 L456 236" stroke="#1a1a1a" stroke-width="2"/>

  <!-- SCR-Katalysator (6) -->
  <rect x="470" y="185" width="80" height="70" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M482 195 V245 M494 195 V245 M506 195 V245 M518 195 V245 M530 195 V245 M542 195 V245" stroke="#1a1a1a" stroke-width="1"/>

  <!-- NOx-Sensor 2 (7) -->
  <rect x="571" y="240" width="18" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Steuergerät mit Signalleitungen -->
  <rect x="260" y="360" width="360" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="440" y="391" text-anchor="middle" fill="#1a1a1a">Motorsteuergerät (CAN)</text>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M295 274 V360 M335 280 V360 M580 280 V360"/>
  </g>

  <!-- Nummern -->
  <g stroke="#1a1a1a" stroke-width="1.5">
    <path d="M135 179 V185 M225 179 V185 M283 296 L291 274 M356 296 L340 280 M418 172 L410 176 M510 179 V185 M600 296 L589 278 M177 56 V62 M78 99 V108 M318 70 V75"/>
  </g>
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="2">
    <circle cx="135" cy="167" r="12"/>
    <circle cx="225" cy="167" r="12"/>
    <circle cx="276" cy="306" r="12"/>
    <circle cx="362" cy="306" r="12"/>
    <circle cx="430" cy="166" r="12"/>
    <circle cx="510" cy="167" r="12"/>
    <circle cx="606" cy="306" r="12"/>
    <circle cx="177" cy="44" r="12"/>
    <circle cx="78" cy="86" r="12"/>
    <circle cx="318" cy="56" r="13"/>
  </g>
  <g fill="#1a1a1a" font-weight="bold" text-anchor="middle">
    <text x="135" y="172">1</text>
    <text x="225" y="172">2</text>
    <text x="276" y="311">3</text>
    <text x="362" y="311">4</text>
    <text x="430" y="171">5</text>
    <text x="510" y="172">6</text>
    <text x="606" y="311">7</text>
    <text x="177" y="49">8</text>
    <text x="78" y="91">9</text>
    <text x="318" y="61">10</text>
  </g>

  <text x="20" y="430" fill="#1a1a1a">gestrichelt neben 10: Heizdraht der Leitung</text>
</svg>
