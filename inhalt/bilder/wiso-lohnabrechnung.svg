<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Arial, sans-serif" font-size="16">
  <title>Vereinfachte Entgeltabrechnung Oktober 2026 eines Kfz-Mechatronikers mit den Zeilen A bis H (Brutto, Steuern, Sozialversicherung, Netto)</title>
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>
  <rect x="16" y="16" width="608" height="448" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="48" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Entgeltabrechnung Oktober 2026 (vereinfacht)</text>
  <text x="320" y="76" text-anchor="middle" font-size="15" fill="#1a1a1a">Geselle, 26 Jahre, Steuerklasse I, kinderlos, Bayern, Kirchenmitglied</text>
  <text x="72" y="108" font-size="15" fill="#1a1a1a">Zeile</text>
  <text x="600" y="108" text-anchor="end" font-size="15" fill="#1a1a1a">Betrag</text>
  <line x1="30" y1="116" x2="610" y2="116" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="44" cy="134" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="140" text-anchor="middle" font-weight="bold" fill="#1a1a1a">A</text>
  <text x="72" y="140" font-weight="bold" fill="#1a1a1a">Bruttoentgelt</text>
  <text x="600" y="140" text-anchor="end" font-weight="bold" fill="#1a1a1a">3.200,00 €</text>
  <line x1="30" y1="154" x2="610" y2="154" stroke="#b8b8b8" stroke-width="1"/>
  <circle cx="44" cy="172" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="178" text-anchor="middle" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="72" y="178" fill="#1a1a1a">Lohnsteuer (Beispielwert)</text>
  <text x="600" y="178" text-anchor="end" fill="#1a1a1a">340,00 €</text>
  <circle cx="44" cy="210" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="216" text-anchor="middle" font-weight="bold" fill="#1a1a1a">C</text>
  <text x="72" y="216" fill="#1a1a1a">Kirchensteuer (8 % von B)</text>
  <text x="600" y="216" text-anchor="end" fill="#1a1a1a">27,20 €</text>
  <circle cx="44" cy="248" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="254" text-anchor="middle" font-weight="bold" fill="#1a1a1a">D</text>
  <text x="72" y="254" fill="#1a1a1a">Rentenversicherung (9,3 %)</text>
  <text x="600" y="254" text-anchor="end" fill="#1a1a1a">297,60 €</text>
  <circle cx="44" cy="286" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="292" text-anchor="middle" font-weight="bold" fill="#1a1a1a">E</text>
  <text x="72" y="292" fill="#1a1a1a">Krankenversicherung (7,3 % + 1,45 % Zusatzbeitrag)</text>
  <text x="600" y="292" text-anchor="end" fill="#1a1a1a">280,00 €</text>
  <circle cx="44" cy="324" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="330" text-anchor="middle" font-weight="bold" fill="#1a1a1a">F</text>
  <text x="72" y="330" fill="#1a1a1a">Pflegeversicherung (1,8 % + 0,6 % Zuschlag)</text>
  <text x="600" y="330" text-anchor="end" fill="#1a1a1a">76,80 €</text>
  <circle cx="44" cy="362" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="368" text-anchor="middle" font-weight="bold" fill="#1a1a1a">G</text>
  <text x="72" y="368" fill="#1a1a1a">Arbeitslosenversicherung (1,3 %)</text>
  <text x="600" y="368" text-anchor="end" fill="#1a1a1a">41,60 €</text>
  <circle cx="44" cy="414" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="44" y="420" text-anchor="middle" font-weight="bold" fill="#1a1a1a">H</text>
  <text x="72" y="420" font-weight="bold" fill="#1a1a1a">Auszahlungsbetrag (Nettoentgelt)</text>
  <text x="600" y="420" text-anchor="end" font-weight="bold" fill="#c0392b">?</text>
  <line x1="30" y1="394" x2="610" y2="394" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="450" text-anchor="middle" font-size="15" fill="#1a1a1a">Beitragssätze 2026 (Arbeitnehmeranteil); Zusatzbeitrag der Kasse 2,9 %</text>
</svg>
